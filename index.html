<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RipCD Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <button class="menu">☰</button>
        <button class="active">✎</button>
        <nav>
          <button>ホーム</button>
          <button>おすすめ</button>
          <button>全曲</button>
        </nav>
      </aside>

      <main class="content">
        <header class="top">
          <h1>ホーム</h1>
          <div class="icons">🔔 ⚙️</div>
        </header>

        <section>
          <h2>おすすめのアーティスト →</h2>
          <div class="row circles">
            <div class="circle"><span>YOASOBI</span></div>
            <div class="circle"><span>嵐</span></div>
            <div class="circle"><span>女王蜂</span></div>
            <div class="circle"><span>TAKESHI</span></div>
            <div class="circle"><span>太鼓の達人</span></div>
          </div>
        </section>

        <section>
          <h2>おすすめの曲 →</h2>
          <div class="row cards">
            <div class="card large"></div>
            <div class="card large"></div>
            <div class="card"></div>
            <div class="card"></div>
          </div>
        </section>

        <section class="player">
          <div class="source-inputs">
            <label>
              音楽フォルダ
              <input id="folderPath" value="./music" />
            </label>
            <button data-api="load-folder">フォルダ読込</button>
            <label>
              CDパス
              <input id="cdPath" value="/media/cdrom" />
            </label>
            <button data-api="load-cd">CD読込</button>
          </div>

          <div class="status">
            <p id="track">Track: -</p>
            <p id="state">State: Stopped</p>
            <p id="meta">0 / 0</p>
          </div>

          <div class="controls">
            <button data-api="prev">⏮</button>
            <button data-api="play">▶</button>
            <button data-api="pause">⏸</button>
            <button data-api="next">⏭</button>
            <button data-api="stop">⏹</button>
          </div>
          <p id="message"></p>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
